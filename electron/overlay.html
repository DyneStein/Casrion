<!DOCTYPE html>
<html>
<head>
  <title>Casrion Overlay</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .toast-container {
      margin-bottom: 40px;
      max-width: 600px;
      padding: 10px 18px;
      box-sizing: border-box;
      background: rgba(246, 239, 225, 0.98);
      border: 1.5px solid #9c4a1f;
      border-radius: 3px;
      color: #241d15;
      font-size: 13.5px;
      font-weight: 500;
      box-shadow: 3px 4px 0 rgba(36, 29, 21, 0.28), 0 10px 25px rgba(0, 0, 0, 0.18);
      display: flex;
      align-items: center;
      gap: 9px;
      opacity: 0;
      transform: translateY(20px) scale(0.95);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .toast-container.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    @keyframes pulse-red {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .pulse {
      animation: pulse-red 2s infinite;
    }

    .icon {
      color: #9c4a1f;
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    #toast-message {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .icon-success {
      color: #9c4a1f;
    }
  </style>
</head>
<body>
  <div id="toast" class="toast-container">
    <span id="toast-icon" class="icon"></span>
    <span id="toast-message">Captured</span>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const toast = document.getElementById('toast');
    const toastMessage = document.getElementById('toast-message');
    const toastIcon = document.getElementById('toast-icon');

    const ACCENT_BORDER = '#9c4a1f';
    const ERROR_BORDER = 'rgba(239, 68, 68, 0.75)';

    // Thin line-art icons (16px, stroke inherits the icon color)
    const svg = (paths) =>
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + paths + '</svg>';
    const ICONS = {
      text: svg('<circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/>'),
      error: svg('<path d="M12 3l10 18H2z"/><line x1="12" y1="10" x2="12" y2="14"/><line x1="12" y1="17.2" x2="12" y2="17.3"/>'),
      image: svg('<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-9 9"/>'),
      heading: svg('<path d="M5 5v14M13 5v14M5 12h8"/><path d="M17 10l2-1.5V19"/>'),
      code: svg('<path d="M8 7l-5 5 5 5"/><path d="M16 7l5 5-5 5"/>'),
      paragraph: svg('<path d="M20 5v8a3 3 0 0 1-3 3H5"/><path d="M8 13l-3 3 3 3"/>'),
      mic: svg('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="21"/>')
    };

    let hideTimeout;

    ipcRenderer.on('show-notification', (event, { message, type, duration = 2000 }) => {
      toastMessage.textContent = message;
      toast.classList.remove('pulse');

      toastIcon.innerHTML = ICONS[type] || ICONS.text;
      toast.style.borderColor = (type === 'error' || type === 'mic') ? ERROR_BORDER : ACCENT_BORDER;
      if (type === 'mic' && duration === 0) toast.classList.add('pulse');

      toast.classList.add('show');

      clearTimeout(hideTimeout);
      if (duration > 0) {
        hideTimeout = setTimeout(() => {
          toast.classList.remove('show');
        }, duration);
      }
    });
  </script>
</body>
</html>
