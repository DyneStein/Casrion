<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Casrion Explain</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      overflow: hidden;
    }
    .panel {
      background: rgba(246, 239, 225, 0.99);
      border: 1.5px solid #9c4a1f;
      border-radius: 3px;
      box-shadow: 4px 5px 0 rgba(36, 29, 21, 0.25), 0 18px 50px rgba(0, 0, 0, 0.22);
      padding: 11px 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      -webkit-app-region: drag;
      cursor: grab;
      margin: -6px -8px 0;
      padding: 6px 8px 2px;
      border-radius: 3px;
    }
    .top-row:hover { background: rgba(156, 74, 31, 0.06); }
    .grip {
      color: rgba(156, 74, 31, 0.45);
      font-size: 11px;
      letter-spacing: 1.5px;
      flex-shrink: 0;
      user-select: none;
    }
    .brand {
      font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
      font-size: 10.5px;
      letter-spacing: 0.05em;
      color: #9c4a1f;
      font-weight: 600;
      white-space: nowrap;
    }
    .app-chip {
      font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
      font-size: 10px;
      color: #8c7d69;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      text-align: right;
    }
    .close-btn {
      -webkit-app-region: no-drag;
      background: transparent;
      border: none;
      color: #8c7d69;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      padding: 2px 4px;
      flex-shrink: 0;
    }
    .close-btn:hover { color: #9c4a1f; }
    .selection {
      font-size: 12px;
      color: #5f5344;
      font-style: italic;
      border-left: 2.5px solid rgba(156, 74, 31, 0.45);
      padding: 1px 0 1px 9px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .answer {
      font-size: 13.5px;
      line-height: 1.55;
      color: #241d15;
      max-height: 300px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .answer::-webkit-scrollbar { width: 7px; }
    .answer::-webkit-scrollbar-thumb { background: rgba(156, 74, 31, 0.35); border-radius: 4px; }
    .answer code {
      font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
      font-size: 12px;
      background: rgba(156, 74, 31, 0.09);
      padding: 0 4px;
      border-radius: 2px;
    }
    .answer.pending { color: #8c7d69; font-style: italic; }
    .literal-wrap {
      border-top: 1px dashed rgba(156, 74, 31, 0.35);
      padding-top: 7px;
      display: none;
    }
    .literal-wrap.show { display: block; }
    .literal-head {
      font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
      font-size: 9.5px;
      letter-spacing: 0.08em;
      color: #9c4a1f;
      font-weight: 600;
      margin-bottom: 3px;
    }
    .literal-text {
      font-size: 12.5px;
      line-height: 1.5;
      color: #5f5344;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .caret {
      display: inline-block;
      width: 7px; height: 13px;
      background: #9c4a1f;
      vertical-align: text-bottom;
      margin-left: 2px;
      animation: blink 0.9s steps(2) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
      font-size: 10px;
      color: #99896f;
      min-height: 20px;
    }
    .hint span { color: #5f5344; font-weight: 600; }
    .hint { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* Sits where the hint normally goes, so it reads as the same line of small
       print rather than an alarm. */
    .hint-fix {
      background: transparent;
      border: 1px solid rgba(156, 74, 31, 0.45);
      border-radius: 3px;
      color: #9c4a1f;
      font-family: inherit;
      font-size: 9.5px;
      padding: 2px 6px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hint-fix:hover { background: rgba(156, 74, 31, 0.12); }
    .modes { display: flex; gap: 3px; flex-shrink: 0; }
    .mode {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 3px;
      color: #8c7d69;
      font-family: inherit;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      cursor: pointer;
      transition: all 0.12s;
    }
    .mode:hover { color: #241d15; background: rgba(156, 74, 31, 0.08); }
    .mode.selected {
      background: rgba(156, 74, 31, 0.12);
      border-color: #9c4a1f;
      color: #9c4a1f;
    }
    .actions { display: flex; gap: 5px; }
    .act {
      background: transparent;
      border: 1px solid rgba(156, 74, 31, 0.5);
      border-radius: 3px;
      color: #9c4a1f;
      font-family: inherit;
      font-size: 10.5px;
      font-weight: 600;
      padding: 3px 10px;
      cursor: pointer;
      transition: all 0.12s;
      display: none;
    }
    .act:hover { background: rgba(156, 74, 31, 0.12); }
    .panel.done .act { display: inline-block; }
    .dl-btn {
      background: rgba(156, 74, 31, 0.12);
      border: 1px solid #9c4a1f;
      border-radius: 3px;
      color: #9c4a1f;
      font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 14px;
      cursor: pointer;
      align-self: flex-start;
    }
    .dl-btn:hover { background: rgba(156, 74, 31, 0.2); }
    .progress-wrap {
      height: 8px;
      background: rgba(36, 29, 21, 0.12);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: #9c4a1f;
      transition: width 0.25s;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="panel" id="panel">
    <div class="top-row" title="Drag to move">
      <div class="grip">&#8942;&#8942;</div>
      <div class="brand">CASRION EXPLAIN</div>
      <div class="app-chip" id="appChip"></div>
      <button class="close-btn" id="closeBtn" title="Close">&#10005;</button>
    </div>
    <div class="selection hidden" id="selection"></div>
    <div class="answer pending" id="answer"></div>
    <div class="literal-wrap" id="literalWrap">
      <div class="literal-head">LITERAL MEANING</div>
      <div class="literal-text" id="literalText"></div>
    </div>
    <button class="dl-btn hidden" id="dlBtn"></button>
    <div class="progress-wrap hidden" id="progressWrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="bottom-row">
      <div class="modes">
        <button class="mode selected" id="modeQuick" title="Short answer, 2 to 3 sentences">Quick</button>
        <button class="mode" id="modeDetail" title="Fuller answer with more context">Detailed</button>
      </div>
      <div class="hint" id="hint"><span>Esc</span> or click outside to close</div>
      <!-- Replaces the hint on macOS once we can tell that clicking outside is
           doing nothing, because the permission it needs was never granted. -->
      <button class="hint-fix hidden" id="clickAwayFix">Clicking outside not closing this? Fix it</button>
      <div class="actions">
        <button class="act" id="copyBtn">Copy</button>
        <button class="act" id="saveBtn">Save to note</button>
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer, clipboard } = require('electron');
    const panel = document.getElementById('panel');
    const appChip = document.getElementById('appChip');
    const selectionEl = document.getElementById('selection');
    const answerEl = document.getElementById('answer');
    const dlBtn = document.getElementById('dlBtn');
    const progressWrap = document.getElementById('progressWrap');
    const progressBar = document.getElementById('progressBar');
    const copyBtn = document.getElementById('copyBtn');
    const saveBtn = document.getElementById('saveBtn');
    const hint = document.getElementById('hint');
    const modeQuick = document.getElementById('modeQuick');
    const modeDetail = document.getElementById('modeDetail');

    const SHORTCUT = (process.platform === 'darwin' ? 'Cmd' : 'Ctrl') + '+Shift+E';

    let detailMode = false;
    function paintMode() {
      modeQuick.classList.toggle('selected', !detailMode);
      modeDetail.classList.toggle('selected', detailMode);
    }
    modeQuick.addEventListener('click', () => {
      if (!detailMode) return;
      detailMode = false;
      paintMode();
      ipcRenderer.send('explain-mode', { detail: false });
    });
    modeDetail.addEventListener('click', () => {
      if (detailMode) return;
      detailMode = true;
      paintMode();
      ipcRenderer.send('explain-mode', { detail: true });
    });

    const literalWrap = document.getElementById('literalWrap');
    const literalText = document.getElementById('literalText');

    let currentSelection = '';
    let answerBuf = '';
    let literalBuf = '';
    let renderQueued = false;

    function esc(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    // Tiny formatter on purpose: the model is told to answer in plain prose,
    // so **bold** and `code` cover everything it actually produces
    function renderAnswer() {
      renderQueued = false;
      let html = esc(answerBuf)
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>');
      const streaming = panel.dataset.state === 'streaming';
      answerEl.innerHTML = html + (streaming ? '<span class="caret"></span>' : '');
      answerEl.scrollTop = answerEl.scrollHeight;
      requestResize();
    }
    function queueRender() {
      if (!renderQueued) { renderQueued = true; requestAnimationFrame(renderAnswer); }
    }
    function requestResize() {
      ipcRenderer.send('explain-resize', panel.offsetHeight + 6);
    }
    function setPending(text) {
      answerEl.classList.add('pending');
      answerEl.textContent = text;
      requestResize();
    }
    function reset(state) {
      panel.dataset.state = state;
      panel.classList.remove('done');
      answerBuf = '';
      literalBuf = '';
      literalWrap.classList.remove('show');
      literalText.textContent = '';
      dlBtn.classList.add('hidden');
      progressWrap.classList.add('hidden');
    }

    // macOS only, and only once the main process is fairly sure the click-away
    // hook is not being delivered. One tap opens the exact settings pane.
    const clickAwayFix = document.getElementById('clickAwayFix');
    const hintEl = document.getElementById('hint');
    clickAwayFix.onclick = () => ipcRenderer.send('explain-fix-click-away');

    ipcRenderer.on('explain-context', (_event, ctx) => {
      const blocked = !!ctx.clickAwayBlocked;
      clickAwayFix.classList.toggle('hidden', !blocked);
      hintEl.classList.toggle('hidden', blocked);
      currentSelection = ctx.selection || '';
      appChip.textContent = ctx.app || '';
      detailMode = !!ctx.detail;
      paintMode();
      selectionEl.classList.toggle('hidden', !currentSelection);
      selectionEl.textContent = currentSelection;
      reset('starting');
      setPending('reading it...');
    });

    ipcRenderer.on('explain-status', (_event, s) => {
      panel.dataset.state = s.state;
      if (s.state === 'no-selection') {
        setPending('Nothing selected' + (s.app ? ' in ' + s.app : '') + '. Highlight some text, then press ' + SHORTCUT + '. If you did highlight something, either that app keeps its selection to itself, or Accessibility is still granted to an older build of Casrion: remove Casrion from that list in System Settings with the minus button, add it back, then quit and reopen Casrion.');
        requestResize();
      } else if (s.state === 'need-permission') {
        // Toggling a stale row off and on does not help: macOS remembers the
        // requirement it was granted under, and every Casrion build is signed
        // with a different one. Only removing the row rewrites it.
        setPending('Casrion needs Accessibility permission to read your selection. Open System Settings > Privacy & Security > Accessibility and turn Casrion ON. If Casrion is already listed there, select it, press the minus button to remove it, then add it back with plus: after an update the old entry no longer matches. Then quit Casrion from the menu bar and reopen it.');
        requestResize();
      } else if (s.state === 'need-model') {
        setPending('One-time setup: Casrion downloads a small offline brain so it can explain things without the internet.');
        dlBtn.textContent = 'Download ' + (s.modelLabel || 'model');
        dlBtn.disabled = false;
        dlBtn.classList.remove('hidden');
        requestResize();
      } else if (s.state === 'downloading') {
        dlBtn.classList.add('hidden');
        progressWrap.classList.remove('hidden');
        progressBar.style.width = (s.pct || 0) + '%';
        setPending('Downloading the offline brain... ' + (s.pct || 0) + '%');
      } else if (s.state === 'downloaded') {
        progressWrap.classList.add('hidden');
        setPending('All set. Highlight something and press ' + SHORTCUT + ' to get an explanation.');
      } else if (s.state === 'warming') {
        setPending('Waking the model up, takes a few seconds. It stays quick after this.');
      } else if (s.state === 'thinking') {
        setPending('Thinking...');
      } else if (s.state === 'streaming') {
        answerEl.classList.remove('pending');
      } else if (s.state === 'error') {
        progressWrap.classList.add('hidden');
        setPending(s.message || 'Something went wrong.');
        if (s.retryDownload) {
          dlBtn.textContent = 'Resume download';
          dlBtn.disabled = false;
          dlBtn.classList.remove('hidden');
          requestResize();
        }
      }
    });

    ipcRenderer.on('explain-chunk', (_event, text) => {
      panel.dataset.state = 'streaming';
      answerEl.classList.remove('pending');
      answerBuf += text;
      queueRender();
    });

    ipcRenderer.on('explain-done', (_event, payload) => {
      panel.dataset.state = 'done';
      if (payload && payload.answer) answerBuf = payload.answer;
      panel.classList.add('done');
      queueRender();
    });

    ipcRenderer.on('explain-literal-chunk', (_event, text) => {
      literalBuf += text;
      literalWrap.classList.add('show');
      literalText.textContent = literalBuf;
      requestResize();
    });
    ipcRenderer.on('explain-literal-done', (_event, payload) => {
      if (payload && payload.literal) literalBuf = payload.literal;
      if (literalBuf) {
        literalWrap.classList.add('show');
        literalText.textContent = literalBuf;
        requestResize();
      }
    });

    dlBtn.addEventListener('click', () => {
      dlBtn.disabled = true;
      ipcRenderer.send('explain-download');
    });
    copyBtn.addEventListener('click', () => {
      clipboard.writeText(answerBuf + (literalBuf ? '\n\nLiteral meaning: ' + literalBuf : ''));
      copyBtn.textContent = 'Copied';
      setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1200);
    });
    saveBtn.addEventListener('click', () => {
      ipcRenderer.send('explain-save-note', {
        selection: currentSelection,
        answer: answerBuf + (literalBuf ? '\n\nLiteral meaning: ' + literalBuf : '')
      });
      saveBtn.textContent = 'Saved';
      setTimeout(() => { saveBtn.textContent = 'Save to note'; }, 1200);
    });
    document.getElementById('closeBtn').addEventListener('click', () => ipcRenderer.send('explain-hide'));
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') ipcRenderer.send('explain-hide');
    });
  </script>
</body>
</html>
